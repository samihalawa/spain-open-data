name: Validate Claude plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_package.py
      - run: npm install --global @anthropic-ai/claude-code@2.1.304
      - run: claude plugin validate --strict .claude-plugin/plugin.json
      - run: claude plugin validate --strict .
      - name: Fresh public-source installation
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          export GIT_TERMINAL_PROMPT=0
          name="${REPOSITORY#*/}"
          claude plugin marketplace add "https://github.com/$REPOSITORY.git"
          claude plugin install "$name@$name"
          claude plugin list
